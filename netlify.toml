# Netlify configuration. Next.js support (the OpenNext adapter) is added by
# Netlify automatically; do not pin its version.
[build]
  command = "npm run build"
  publish = ".next"
  # Skip the build (and its deploy credits) when only docs/tests changed.
  # Exit code 0 = skip, 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public netlify package.json package-lock.json next.config.ts netlify.toml tsconfig.json postcss.config.mjs"

[build.environment]
  NODE_VERSION = "22"
  # Playwright's test browser is not needed on Netlify.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[functions]
  directory = "netlify/functions"
