name: CI

# Lint, type-check, unit tests, production build and browser (E2E) tests.
# Needs no secrets: tests use an in-memory database and a fake Razorpay.
on:
  push:
    branches: [main, production-readiness]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit & API tests
        run: npm test

      - name: Production build
        run: npx next build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser (E2E) tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
